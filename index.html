<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ماشین حساب آرب روزانه</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:linear-gradient(135deg,#eef4ff,#f5efff);color:#18181b;font-family:Tahoma,Arial,sans-serif}
.app{max-width:620px;margin:auto;background:#fff;border-radius:20px;padding:19px;box-shadow:0 8px 30px #00000012}
h1{font-size:24px;margin:0 0 6px}.sub{color:#71717a;font-size:13px;margin-bottom:16px}
label{display:block;font-weight:700;margin:9px 0 6px}input{width:100%;padding:12px;border:1px solid #c7d2fe;border-radius:11px;font-size:18px;outline:none}
.row{display:flex;gap:8px}.row button{flex:1}button{border:0;border-radius:10px;padding:11px 9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:9px}
.normal{background:#2563eb;color:#fff}.loss{background:#7c3aed;color:#fff}.gray{background:#e8e7f3;color:#3730a3}
.card{margin-top:14px;padding:14px;border-radius:14px;background:#f8f8ff;border:1px solid #e0e7ff}.big{font-size:23px;font-weight:800;margin:7px 0}.good{color:#1d4ed8}.bad{color:#6d28d9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{background:#fff;border:1px solid #e4e4e7;border-radius:11px;padding:9px;font-size:13px}.stat b{display:block;font-size:17px;margin-top:3px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid #e4e4e7;text-align:center}.empty{color:#71717a;text-align:center}.note{font-size:11px;color:#71717a;line-height:1.8;margin-top:10px}
@media(max-width:420px){.app{padding:15px}.stats{grid-template-columns:1fr 1fr}table{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<h1>ماشین حساب آرب</h1>
<div class="sub">هر خط ۲۳٬۰۰۰ تومان • کمیسیون هر آرب ۴۰۰٬۰۰۰ تومان</div>
<label for="lines">تعداد خط‌های آرب</label>
<input id="lines" type="number" min="0" step="1" inputmode="numeric" placeholder="مثلاً ۲۰">
<div class="row"><button class="normal" id="normalBtn">➕ آرب عادی</button><button class="loss" id="lossBtn">🔻 آرب ضرری</button></div>
<div id="last" class="card" style="display:none"></div>
<div class="row"><button class="gray" id="undoBtn">حذف آخرین ثبت</button><button class="gray" id="clearBtn">پاک کردن روز</button></div>
<div id="summary" class="card"></div><div id="list"></div>
<div class="note"><strong>محاسبه:</strong><br>آرب عادی = (خط × ۲۳٬۰۰۰) − ۴۰۰٬۰۰۰<br>آرب ضرری = (خط × ۲۳٬۰۰۰) + ۴۰۰٬۰۰۰ کسر از کارکرد روز<br><strong>کمیسیون روزانه = تعداد کل آرب × ۴۰۰٬۰۰۰ تومان</strong></div>
</div>
<script>
const RATE=23000,COMM=400000,KEY="arb_day_new_v2";let items=JSON.parse(localStorage.getItem(KEY)||"[]");
function toman(n){return new Intl.NumberFormat("fa-IR").format(Math.round(Math.abs(n)))+" تومان"}function count(n){return new Intl.NumberFormat("fa-IR").format(n)}function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function add(isLoss){const input=document.getElementById("lines"),lines=Number(input.value);if(!Number.isInteger(lines)||lines<=0){alert("لطفاً تعداد خط را درست وارد کن.");return}const gross=lines*RATE,effect=isLoss?-(gross+COMM):gross-COMM;items.push({lines,isLoss,gross,effect});save();const last=document.getElementById("last");last.style.display="block";last.innerHTML=`<div>ثبت شد: <b>${isLoss?"آرب ضرری 🔻":"آرب عادی ➕"}</b></div><div>${count(lines)} خط — مبلغ خطوط: ${toman(gross)}</div><div>کمیسیون این آرب: <b>${toman(COMM)}</b></div><div class="${effect>=0?"good":"bad"} big">${effect>=0?"+":"−"} ${toman(effect)}</div>`;input.value="";input.focus();render()}
function undo(){if(!items.length)return;items.pop();save();render()}
function clearDay(){if(items.length&&confirm("همه ثبت‌های امروز پاک شود؟")){items=[];save();document.getElementById("last").style.display="none";render()}}
function render(){const normal=items.filter(x=>!x.isLoss),losses=items.filter(x=>x.isLoss),totalLines=items.reduce((s,x)=>s+x.lines,0),normalGross=normal.reduce((s,x)=>s+x.gross,0),lossGross=losses.reduce((s,x)=>s+x.gross,0),normalNet=normal.reduce((s,x)=>s+x.effect,0),lossDeduction=losses.reduce((s,x)=>s+(x.gross+COMM),0),totalCommission=items.length*COMM,net=items.reduce((s,x)=>s+x.effect,0);
document.getElementById("summary").innerHTML=`<b>گزارش امروز</b><div class="big ${net>=0?"good":"bad"}">${net>=0?"کارکرد خالص":"کسر / ضرر خالص"}: ${net<0?"− ":"+ "}${toman(net)}</div><div class="stats"><div class="stat">تعداد کل آرب<b>${count(items.length)}</b></div><div class="stat">مجموع خط‌ها<b>${count(totalLines)}</b></div><div class="stat">آرب عادی<b>${count(normal.length)}</b></div><div class="stat">آرب ضرری<b>${count(losses.length)}</b></div><div class="stat">💰 کل کمیسیون امروز<b>${toman(totalCommission)}</b></div><div class="stat">درآمد ناخالص عادی<b>${toman(normalGross)}</b></div><div class="stat">کارکرد خالص عادی<b>${toman(normalNet)}</b></div><div class="stat">مبلغ خطوط ضرری<b>${toman(lossGross)}</b></div><div class="stat">کسر آرب ضرری<b class="bad">${toman(lossDeduction)}</b></div></div>`;
if(!items.length){document.getElementById("list").innerHTML='<div class="card empty">هنوز آربی ثبت نشده.</div>';return}
let rows=items.map((x,i)=>`<tr><td>${count(i+1)}</td><td>${x.isLoss?"ضرری 🔻":"عادی ➕"}</td><td>${count(x.lines)}</td><td>${toman(x.gross)}</td><td>${toman(COMM)}</td><td class="${x.effect>=0?"good":"bad"}">${x.effect>=0?"+":"−"}${toman(x.effect)}</td></tr>`).join("");
document.getElementById("list").innerHTML=`<div class="card"><b>آرب‌های ثبت‌شده امروز</b><table><thead><tr><th>#</th><th>نوع</th><th>خط</th><th>مبلغ</th><th>کمیسیون</th><th>اثر روز</th></tr></thead><tbody>${rows}</tbody></table></div>`}
document.getElementById("normalBtn").addEventListener("click",()=>add(false));document.getElementById("lossBtn").addEventListener("click",()=>add(true));document.getElementById("undoBtn").addEventListener("click",undo);document.getElementById("clearBtn").addEventListener("click",clearDay);document.getElementById("lines").addEventListener("keydown",e=>{if(e.key==="Enter")add(false)});render();
</script></body></html>
