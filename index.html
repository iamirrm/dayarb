<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماشین حساب آربیتراژ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0f1115;color:#f5f5f5;display:flex;justify-content:center;padding:24px}
.card{width:min(430px,100%);background:#191c22;border:1px solid #2b3039;border-radius:20px;padding:22px;box-shadow:0 12px 40px #0005}
h1{text-align:center;margin:0 0 18px;font-size:24px}
label{display:block;margin:14px 0 7px;color:#b9c0cc;font-size:14px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #343a45;background:#101217;color:#fff;font-size:18px;outline:none}
input:focus{border-color:#6d7cff}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#6875ff;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.99)}
.result{margin-top:18px;padding:16px;border-radius:14px;background:#101217;border:1px solid #2d333d}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #272c34}
.row:last-child{border-bottom:0}
.value{font-weight:bold}
.note{font-size:12px;color:#8f98a8;text-align:center;margin-top:15px;line-height:1.8}
</style>
</head>
<body>
<div class="card">
<h1>🧮 ماشین حساب آربیتراژ</h1>

<label for="lines">تعداد لاین</label>
<input id="lines" type="number" min="0" step="1" placeholder="مثلاً 20">

<label for="unit">ارزش هر لاین (تومان)</label>
<input id="unit" type="number" min="0" step="1000" value="23000">

<label for="fee">کارمزد (تومان)</label>
<input id="fee" type="number" min="0" step="10000" value="400000">

<button id="calc">محاسبه</button>

<div class="result" id="result">
  <div class="row"><span>ارزش لاین‌ها</span><span class="value" id="gross">۰ تومان</span></div>
  <div class="row"><span>سود خالص</span><span class="value" id="profit">۰ تومان</span></div>
  <div class="row"><span>مبلغ در حالت ضرر</span><span class="value" id="loss">۰ تومان</span></div>
</div>

<div class="note">فرمول سود: تعداد لاین × ۲۳٬۰۰۰ − ۴۰۰٬۰۰۰<br>فرمول ضرر: تعداد لاین × ۲۳٬۰۰۰ + ۴۰۰٬۰۰۰</div>
</div>

<script>
const lines = document.getElementById('lines');
const unit = document.getElementById('unit');
const fee = document.getElementById('fee');

function fa(n){ return Math.round(n).toLocaleString('fa-IR') + ' تومان'; }

function calc(){
  const l = Math.max(0, Number(lines.value) || 0);
  const u = Math.max(0, Number(unit.value) || 0);
  const f = Math.max(0, Number(fee.value) || 0);
  const gross = l * u;
  document.getElementById('gross').textContent = fa(gross);
  document.getElementById('profit').textContent = fa(gross - f);
  document.getElementById('loss').textContent = fa(gross + f);
}
document.getElementById('calc').addEventListener('click', calc);
[lines,unit,fee].forEach(x=>x.addEventListener('input',calc));
calc();
</script>
</body>
</html>
